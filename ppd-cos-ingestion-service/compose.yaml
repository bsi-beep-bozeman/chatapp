services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ppd_cos_local
      POSTGRES_USER: ppd_cos_local
      POSTGRES_PASSWORD: synthetic-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppd_cos_local -d ppd_cos_local"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
